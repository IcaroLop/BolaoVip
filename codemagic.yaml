workflows:
  ios-workflow:
    name: iOS Build - Bolao VIP
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: br.com.bolaovip
      vars:
        BUNDLE_ID: br.com.bolaovip
        XCODE_WORKSPACE: "frontend/bolao-vip/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 18
      xcode: 15.0
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'master'
          include: true
      
    scripts:
      - name: Install npm dependencies
        script: |
          cd frontend/bolao-vip
          npm ci
      
      - name: Build React App
        script: |
          cd frontend/bolao-vip
          npm run build
      
      - name: Sync Capacitor
        script: |
          cd frontend/bolao-vip
          npx cap sync ios

      - name: Configurar assinatura automática (Ad Hoc)
        script: |
          # Requer integração App Store Connect habilitada no Codemagic
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --create
          keychain add-certificates
          xcode-project use-profiles
      
      - name: Install CocoaPods dependencies
        script: |
          cd frontend/bolao-vip
          cd ios/App
          pod install
      
      - name: Build iOS App
        script: |
          cd frontend/bolao-vip
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --export-method ad-hoc
    
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    
    publishing:
      email:
        recipients:
          - icaro.sales.lopes.isl@gmail.com
        notify:
          success: true
          failure: true
      
      # Descomente para publicar na App Store automaticamente:
      # app_store_connect:
      #   api_key: $APP_STORE_CONNECT_PRIVATE_KEY
      #   key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
      #   issuer_id: $APP_STORE_CONNECT_ISSUER_ID
